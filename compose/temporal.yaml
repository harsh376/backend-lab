# Local Temporal development server with its built-in Web UI.
# Start: docker compose -f compose/temporal.yaml up -d
# Stop: docker compose -f compose/temporal.yaml down (preserves data)
# Reset: docker compose -f compose/temporal.yaml down -v (deletes workflow data)
services:
  temporal-init:
    image: temporalio/temporal:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - temporal-data:/data

  temporal:
    image: temporalio/temporal:latest
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:7233:7233" # Python SDK
      - "127.0.0.1:8233:8233" # Web UI
    volumes:
      - temporal-data:/data

volumes:
  temporal-data:
