# Local Temporal development server with its built-in Web UI, plus the agent
# worker that runs the kilt-answers workflows and its MCP entrypoint.
# Start: docker compose -f compose/temporal.yaml up -d --build
# Stop: docker compose -f compose/temporal.yaml down (preserves data)
# Reset: docker compose -f compose/temporal.yaml down -v (deletes workflow data)
services:
  temporal-init:
    image: temporalio/temporal:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - temporal-data:/data

  temporal:
    image: temporalio/temporal:latest
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:7233:7233" # Python SDK
      - "127.0.0.1:8233:8233" # Web UI
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Reaches Elasticsearch by service name when compose/elasticsearch.yaml is
  # also up: both files share the default Compose project and network.
  agent-worker:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      KILT_INDEX: ${KILT_INDEX:-kilt}
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    command:
      - python
      - -m
      - apps.mcp.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temporal-data:
