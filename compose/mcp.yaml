# Start after Temporal is healthy: docker compose -f compose/mcp.yaml up --build
services:
  # Reaches Elasticsearch by service name when compose/elasticsearch.yaml is
  # also up: both files share the default Compose project and network.
  agent-worker:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    environment:
      # Optional overrides; all defaults are defined by Settings in backend/config.py.
      TIMEOUT_MODEL_REQUEST_SECONDS:
      TIMEOUT_MODEL_REQUEST_MAX_SECONDS:
      TIMEOUT_ACTIVITY_OVERHEAD_SECONDS:
      MODEL_MAX_ATTEMPTS:
      TIMEOUT_ANSWER_EVAL_SECONDS:
      TIMEOUT_RETRIEVAL_EVAL_SECONDS:
      TIMEOUT_EVAL_MAX_SECONDS:
      TIMEOUT_RETRIEVAL_ACTIVITY_SECONDS:
      TIMEOUT_RETRIEVAL_ACTIVITY_TOTAL_SECONDS:
      TIMEOUT_BUDGET_QUOTE_SECONDS:
      TIMEOUT_BUDGET_QUOTE_TOTAL_SECONDS:
      TIMEOUT_RECORD_RESULT_SECONDS:
      TIMEOUT_RECORD_RESULT_TOTAL_SECONDS:
      TIMEOUT_LOCAL_DATASET_LOAD_SECONDS:
      TIMEOUT_HOSTED_DATASET_LOAD_SECONDS:
      TIMEOUT_DATASET_EXPORT_HTTP_SECONDS:
      TIMEOUT_DATASET_FETCH_HTTP_SECONDS:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-local}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      KILT_INDEX: ${KILT_INDEX:-kilt}
      MCP_ANSWER_MODEL: ${MCP_ANSWER_MODEL:-ollama_chat/qwen3.8}
      MCP_VERIFIER_MODEL: ${MCP_VERIFIER_MODEL:-}
      MCP_ANSWER_MAX_TOKENS: ${MCP_ANSWER_MAX_TOKENS:-1024}
      MCP_ANSWER_CONTEXT_MODE: ${MCP_ANSWER_CONTEXT_MODE:-compact}
      MCP_ANSWER_CONTEXT_MAX_TOKENS: ${MCP_ANSWER_CONTEXT_MAX_TOKENS:-5000}
      MCP_ANSWER_CONTEXT_MAX_PARAGRAPHS: ${MCP_ANSWER_CONTEXT_MAX_PARAGRAPHS:-12}
      MCP_ANSWER_PASSAGE_RANKER: ${MCP_ANSWER_PASSAGE_RANKER:-bm25}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    command:
      - python
      - -m
      - apps.mcp.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      # Optional overrides; all defaults are defined by Settings in backend/config.py.
      TIMEOUT_MODEL_REQUEST_SECONDS:
      TIMEOUT_MODEL_REQUEST_MAX_SECONDS:
      TIMEOUT_ACTIVITY_OVERHEAD_SECONDS:
      MODEL_MAX_ATTEMPTS:
      TIMEOUT_ANSWER_EVAL_SECONDS:
      TIMEOUT_RETRIEVAL_EVAL_SECONDS:
      TIMEOUT_EVAL_MAX_SECONDS:
      TIMEOUT_RETRIEVAL_ACTIVITY_SECONDS:
      TIMEOUT_RETRIEVAL_ACTIVITY_TOTAL_SECONDS:
      TIMEOUT_BUDGET_QUOTE_SECONDS:
      TIMEOUT_BUDGET_QUOTE_TOTAL_SECONDS:
      TIMEOUT_RECORD_RESULT_SECONDS:
      TIMEOUT_RECORD_RESULT_TOTAL_SECONDS:
      TIMEOUT_LOCAL_DATASET_LOAD_SECONDS:
      TIMEOUT_HOSTED_DATASET_LOAD_SECONDS:
      TIMEOUT_DATASET_EXPORT_HTTP_SECONDS:
      TIMEOUT_DATASET_FETCH_HTTP_SECONDS:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-local}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-true}
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  inspector:
    image: node:22-slim
    command:
      - npx
      - --yes
      - "@modelcontextprotocol/inspector"
      - --server-url
      - http://mcp:8001/mcp
      - --transport
      - http
    environment:
      HOST: "0.0.0.0"
      DANGEROUSLY_BIND_ALL_INTERFACES: "true"
      MCP_AUTO_OPEN_ENABLED: "false"
    ports:
      - "127.0.0.1:6274:6274"
    depends_on:
      - mcp
    restart: unless-stopped
