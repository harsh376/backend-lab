---
services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15
  migrations:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-my_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  otel-lgtm:
    image: grafana/otel-lgtm:0.32.1
    volumes:
      - otel-lgtm-data:/data
      - ../infra/grafana/dashboards:/var/lib/grafana/custom-dashboards:ro
      - ../infra/grafana/provisioning/api.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/api.yaml:ro
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-my_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_METRIC_EXPORT_INTERVAL: "20000"
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 5s
      timeout: 3s
      retries: 10

  api-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      - celery
      - -A
      - apps.api.background.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - --queues=api
    stop_grace_period: 90s
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-my_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      HOLD_REMINDER_WINDOW_MINUTES: ${HOLD_REMINDER_WINDOW_MINUTES:-120}
      HOLD_NOTIFICATION_BATCH_SIZE: ${HOLD_NOTIFICATION_BATCH_SIZE:-200}
      OTEL_SERVICE_NAME: api-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_METRIC_EXPORT_INTERVAL: "20000"
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started

  api-beat:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      - celery
      - -A
      - apps.api.background.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      HOLD_NOTIFICATION_INTERVAL_SECONDS: >-
        ${HOLD_NOTIFICATION_INTERVAL_SECONDS:-600}
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: >-
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ../apps/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  redis-data:
  otel-lgtm-data:
  frontend-node-modules:
