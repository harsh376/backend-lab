---
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15
  migrations:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-my_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  otel-lgtm:
    image: grafana/otel-lgtm:0.32.1
    volumes:
      - otel-lgtm-data:/data
      - ../infra/grafana/dashboards:/var/lib/grafana/custom-dashboards:ro
      - ../infra/grafana/provisioning/api.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/api.yaml:ro
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-my_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_METRIC_EXPORT_INTERVAL: "20000"
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/live')"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  otel-lgtm-data:
