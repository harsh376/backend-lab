[project]
name = "my-app"
version = "0.1.0"
description = "Reusable FastAPI backend interview skeleton"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "yamllint>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["app"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
